<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Bright Wave</title>
    <link rel="stylesheet" href="Styles.CSS">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">Bright Wave</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <button id="theme-btn">Dark Mode</button>
    </header>

    <main>
        <h1>Contact Us</h1>
        <p>Fill out this form to send us a message.</p>

        <form id="my-form">
            <!-- Error message container for JS -->
            <p id="error-text" style="color: red; font-weight: bold;"></p>

            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name"><br><br>

            <label for="email">Email:</label><br>
            <input type="text" id="email" name="email"><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4"></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Bright Wave</p>
    </footer>
</body>
</html>
