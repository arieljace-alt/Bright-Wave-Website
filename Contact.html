<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bright Wave Web Design - Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>Contact Us</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Send Us a Message</h2>
            <p>Please fill out the form below to get a free price quote for your website project.</p>

            <form action="#" method="post">
                <fieldset>
                    <legend>Contact Form</legend>

                    <p>
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" name="name" required>
                        <span id="name-error" style="color: red; font-size: 0.9rem;"></span>
                    </p>

                    <p>
                        <label for="email">Your Email:</label>
                        <input type="email" id="email" name="email" required>
                        <span id="email-error" style="color: red; font-size: 0.9rem;"></span>
                    </p>

                    <p>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone">
                    </p>

                    <p>
                        <label for="service">Service Requested:</label>
                        <select id="service" name="service" required>
                            <option value="">Select a Service</option>
                            <option value="web-design">Web Design</option>
                            <option value="seo">Search Engine Setup</option>
                            <option value="updates">Site Updates</option>
                        </select>
                    </p>

                    <!-- Interactive Feature Output Container -->
                    <p id="price-estimate" style="font-weight: bold; color: #1E3A8A;">Estimated Base Price: $0</p>

                    <p>
                        <label for="message">Project Details:</label>
                        <textarea id="message" name="message" rows="4" required></textarea>
                    </p>

                    <p>
                        <button type="submit">Submit</button>
                    </p>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright 2026 Bright Wave Web Design</p>
    </footer>

    <!-- Connect JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
